name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        # test_phii_limits.py builds its o1/k11 arms by `git apply`-ing patches that
        # live only in docs/dev/phii-identity/hpc/b14/, untracked since a32b098e. CI
        # checks out a clean tree, so those arms can never be built here and the suite
        # fails by design rather than skipping silently. This is that file's own
        # documented opt-out ("to test the shipped scheme alone on purpose"), which is
        # exactly CI's situation. The structural result (O1 cannot pass L1/L1b/L4) is
        # still measured wherever the patches exist -- locally and on the HPC arms.
        env:
          PHII_ALLOW_MISSING_ARMS: "1"
        run: pytest test/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files
